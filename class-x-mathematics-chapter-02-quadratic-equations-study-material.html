<h2>8️⃣ Formation of a Quadratic Equation</h2>

<p>
If α and β are the roots, the corresponding
quadratic equation can be formed using:
</p>

<div class="formula">

x² − (α + β)x + αβ = 0

</div>

<div class="example">

<strong>Example:</strong>

<br><br>

If:

<br>

α = 2, &nbsp;&nbsp; β = 5

<br><br>

Then:

<br>

α + β = 7

<br>

αβ = 10

<br><br>

Therefore:

<br>

x² − 7x + 10 = 0

</div>

</div>


<!-- 9 -->

<div class="card">

<h2>9️⃣ Equations Reducible to Quadratic Form</h2>

<p>
Some equations can be transformed into a quadratic
equation by using a suitable substitution.
</p>

<div class="method">

<strong>General Approach</strong>

<br><br>

1. Identify the repeated expression.

<br><br>

2. Replace it by a new variable.

<br><br>

3. Form a quadratic equation in the new variable.

<br><br>

4. Solve the quadratic equation.

<br><br>

5. Substitute back to obtain the required value
of the original variable.

</div>

<div class="important">

💡 Always substitute the obtained value back into
the original expression when required.

</div>

</div>


<!-- 10 -->

<div class="card">

<h2>🔟 Applications of Quadratic Equations</h2>

<p>
Quadratic equations are used to solve problems where
the relationship between quantities leads to a
second-degree equation.
</p>

<h3>General Steps</h3>

<ol>

<li>Read the problem carefully.</li>

<li>Let the unknown quantity be x.</li>

<li>Express the other quantities in terms of x.</li>

<li>Form the equation from the given condition.</li>

<li>Convert it into quadratic form.</li>

<li>Solve the quadratic equation.</li>

<li>Check the obtained roots.</li>

<li>Reject any root that does not satisfy the
conditions of the problem.</li>

<li>Write the final answer clearly.</li>

</ol>

</div>


<!-- 11 -->

<div class="card">

<h2>1️⃣1️⃣ Checking a Solution</h2>

<p>
A value is a root of a quadratic equation only when
substitution makes the original equation equal to zero.
</p>

<div class="example">

<strong>Example:</strong>

<br><br>

For:

<br>

2x² − 5x + 2 = 0

<br><br>

substitute the proposed value of x into the
original equation.

</div>

<div class="important">

✅ If the result is 0, the value satisfies the equation.

<br><br>

❌ If the result is not 0, the value is not a root.

</div>

</div>


<!-- 12 -->

<div class="card">

<h2>1️⃣2️⃣ Important Formula Box</h2>

<div class="formula">

<strong>Standard Form</strong>

<br>

ax² + bx + c = 0

<br><br>

<strong>Quadratic Formula</strong>

<br>

x = (−b ± √(b² − 4ac)) / 2a

<br><br>

<strong>Discriminant</strong>

<br>

D = b² − 4ac

<br><br>

<strong>Sum of Roots</strong>

<br>

α + β = −b/a

<br><br>

<strong>Product of Roots</strong>

<br>

αβ = c/a

</div>

</div>

<div class="card">

<h2>1️⃣3️⃣ Exam Preparation Points</h2>

<ul>

<li>✔️ Write the equation clearly.</li>

<li>✔️ Convert the equation to standard form.</li>

<li>✔️ Identify a, b and c correctly.</li>

<li>✔️ Be careful with positive and negative signs.</li>

<li>✔️ Choose a suitable method.</li>

<li>✔️ Show the important working steps.</li>

<li>✔️ Write both roots clearly.</li>

<li>✔️ Check the roots when required.</li>

<li>✔️ In application problems, check whether the
root satisfies the original condition.</li>

</ul>

</div>


<!-- QUICK REVISION -->

<div class="summary">

<h2>🎯 Quick Chapter Revision</h2>

<ul>

<li>📌 Quadratic equation → equation of degree two.</li>

<li>📌 Standard form → ax² + bx + c = 0.</li>

<li>📌 Methods → factorisation, completing the square
and quadratic formula.</li>

<li>📌 Discriminant → D = b² − 4ac.</li>

<li>📌 D &gt; 0 → two distinct real roots.</li>

<li>📌 D = 0 → two equal real roots.</li>

<li>📌 D &lt; 0 → no real roots.</li>

<li>📌 Sum of roots → −b/a.</li>

<li>📌 Product of roots → c/a.</li>

<li>📌 Always check the answer when required.</li>

</ul>
